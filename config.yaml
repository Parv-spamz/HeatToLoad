project:
  name: "heat-to-load"
  description: "Temperature Sensitivity of Peak Electricity Demand Across Indian States"
  random_seed: 42

paths:
  raw_dir: "data/raw"
  raw_demand_dir: "data/raw/demand"
  raw_weather_dir: "data/raw/weather"
  interim_dir: "data/interim"
  processed_dir: "data/processed"
  database_path: "data/processed/heat_to_load.db"
  manifest_path: "data/MANIFEST.csv"
  results_path: "reports/results.json"
  tableau_dir: "tableau"
  logs_dir: "logs"

modeling:
  # Holdout period defined before modeling (Peak summer 2024)
  holdout_start: "2024-04-01"
  holdout_end: "2024-09-30"
  # Fixed reference period for monthly 95th percentile temperature heatwave baseline
  heatwave_reference_start: "2023-04-01"
  heatwave_reference_end: "2024-03-31"
  # CV configuration
  n_cv_splits: 4
  cv_window_type: "expanding" # rolling-origin / expanding window

weather:
  api_endpoint: "https://archive-api.open-meteo.com/v1/archive"
  variables:
    - "temperature_2m_max"
    - "temperature_2m_min"
    - "temperature_2m_mean"
    - "apparent_temperature_max"
    - "relative_humidity_2m_mean"
    - "precipitation_sum"
  attribution: "Weather data provided by Open-Meteo.com under Non-Commercial / Attribution terms (ERA5 reanalysis)."

